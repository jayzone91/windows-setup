name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PowerShell checks and tests
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module `
            PSScriptAnalyzer `
            -Scope CurrentUser `
            -Force `
            -AllowClobber `
            -Repository PSGallery

      - name: Code checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./modules/Helpers/index.ps1
          . ./modules/PowerShell/index.ps1
          Test-PowerShellCode `
            -Path . `
            -FailOnAnyIssue

      - name: Pester tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = Invoke-Pester `
            -Path ./tests `
            -PassThru

          if ($result.FailedCount -gt 0) {
              throw (
                  'Pester fehlgeschlagen: {0} Test(s).' -f
                  $result.FailedCount
              )
          }